name: Test no match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files
        run: |
          rm -rf test-data-nomatch
          mkdir -p test-data-nomatch
          echo "alpha beta" > test-data-nomatch/a.txt
      - id: action
        uses: .
        with:
          include: "test-data-nomatch/**"
          find: "zzz-not-present"
          replace: "x"
      - name: Assert nothing changed
        env:
          MODIFIED: ${{ steps.action.outputs.modifiedFiles }}
        run: |
          echo "modifiedFiles: $MODIFIED"
          if [ "$(cat test-data-nomatch/a.txt)" != "alpha beta" ]; then
            echo "FAIL: file changed"; exit 1
          fi
          if [ "$MODIFIED" != "0" ]; then
            echo "FAIL: expected modifiedFiles=0"; exit 1
          fi
          echo "PASS"
