name: Test basic find and replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with known content
        run: |
          echo "Hello World, this is a test file." > "$GITHUB_WORKSPACE/test-input.txt"
          echo "Another line with World in it." >> "$GITHUB_WORKSPACE/test-input.txt"

      - id: action
        uses: .
        with:
          find: "World"
          replace: "Earth"
          include: "test-input.txt"

      - name: Assert modifiedFiles output
        env:
          MODIFIED: ${{ steps.action.outputs.modifiedFiles }}
        run: |
          echo "modifiedFiles: $MODIFIED"
          if [ "$MODIFIED" != "1" ]; then
            echo "FAIL: expected modifiedFiles=1, got '$MODIFIED'"
            exit 1
          fi
          echo "PASS: modifiedFiles=1"

      - name: Assert file content was replaced
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-input.txt")
          echo "File content: $CONTENT"
          if echo "$CONTENT" | grep -q "World"; then
            echo "FAIL: 'World' still found in file after replacement"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "Earth"; then
            echo "FAIL: 'Earth' not found in file after replacement"
            exit 1
          fi
          echo "PASS: replacement successful"
