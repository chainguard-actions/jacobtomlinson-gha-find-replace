name: Test regex replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files
        run: |
          rm -rf test-data-regex
          mkdir -p test-data-regex
          echo "version: 1.2.3" > test-data-regex/v.txt
      - id: action
        uses: .
        with:
          include: "test-data-regex/**"
          find: "[0-9]+\\.[0-9]+\\.[0-9]+"
          replace: "9.9.9"
          regex: "true"
      - name: Assert regex replaced
        env:
          MODIFIED: ${{ steps.action.outputs.modifiedFiles }}
        run: |
          echo "modifiedFiles: $MODIFIED"
          ACTUAL="$(cat test-data-regex/v.txt)"
          echo "content: $ACTUAL"
          if [ "$ACTUAL" != "version: 9.9.9" ]; then
            echo "FAIL: expected 'version: 9.9.9'"; exit 1
          fi
          if [ "$MODIFIED" != "1" ]; then
            echo "FAIL: expected modifiedFiles=1"; exit 1
          fi
          echo "PASS"
